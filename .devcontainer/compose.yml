services:
  project-manager:
    container_name: project-manager
    build:
      context: ../
      dockerfile: ./.devcontainer/Dockerfile
    volumes:
      - ../..:/workspaces:cached
    command: sleep infinity
    env_file:
      - ./.env

  litellm:
    container_name: litellm
    image: ghcr.io/berriai/litellm:main-stable
    volumes:
      - ../.devcontainer/litellm-config.yaml:/app/config.yaml:cached
    command:
      - "--config=/app/config.yaml"
    ports:
      - "4000:4000"
    env_file:
      - ./.env
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "wget --no-verbose --tries=1 http://localhost:4000/health/liveliness || exit 1",
        ]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s
